<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CoinXP</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="header-container">

            <h1>CoinXP</h1>

            <button id="addTransactionButton">
                + Nova transação
            </button>

        </div>
    </header>


    <main class="container">

        <section class="intro">

            <p>Visão geral</p>

            <h2>Meu financeiro</h2>

            <span>Controle suas receitas e despesas.</span>

        </section>


        <section class="cards">

            <div class="card">
                <span>Saldo</span>
                <h3 id="balance">R$ 0,00</h3>
            </div>

            <div class="card">
                <span>Receitas</span>
                <h3 id="income">R$ 0,00</h3>
            </div>

            <div class="card">
                <span>Despesas</span>
                <h3 id="expenses">R$ 0,00</h3>
            </div>

        </section>


        <section class="transactions">

            <div class="transactions-header">

                <div>

                    <h2>Transações</h2>

                    <p>Suas movimentações recentes</p>

                </div>

            </div>


            <div class="transaction-filters">

                <span>Filtrar:</span>

                <button id="allButton">
                    Todas
                </button>

                <button id="incomeButton">
                    Receitas
                </button>

                <button id="expenseButton">
                    Despesas
                </button>

            </div>


            <div class="empty-state" id="emptyState">

                <h3>Nenhuma transação</h3>

                <p>
                    Você ainda não adicionou nenhuma movimentação.
                </p>

                <button id="emptyAddButton">
                    + Adicionar transação
                </button>

            </div>


            <div id="transactionList"></div>

        </section>

    </main>


    <div class="modal" id="transactionModal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="modalTitle">
                    Nova transação
                </h2>

                <button id="closeModal">
                    ×
                </button>

            </div>


            <form id="transactionForm">

                <label for="description">
                    Descrição
                </label>

                <input
                    type="text"
                    id="description"
                    placeholder="Ex: Mercado"
                    required
                >


                <label for="amount">
                    Valor
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="0,00"
                    step="0.01"
                    min="0"
                    required
                >


                <label for="type">
                    Tipo
                </label>

                <select id="type" required>

                    <option value="income">
                        Receita
                    </option>

                    <option value="expense">
                        Despesa
                    </option>

                </select>


                <label for="category">
                    Categoria
                </label>

                <select id="category" required>

                    <option value="food">
                        Alimentação
                    </option>

                    <option value="transport">
                        Transporte
                    </option>

                    <option value="shopping">
                        Compras
                    </option>

                    <option value="leisure">
                        Lazer
                    </option>

                    <option value="home">
                        Casa
                    </option>

                    <option value="work">
                        Trabalho
                    </option>

                    <option value="study">
                        Estudos
                    </option>

                    <option value="other">
                        Outros
                    </option>

                </select>


                <div class="form-buttons">

                    <button type="button" id="cancelButton">
                        Cancelar
                    </button>

                    <button type="submit" id="submitButton">
                        Adicionar
                    </button>

                </div>

            </form>

        </div>

    </div>


    <footer>

        <p>
            CoinXP © 2026
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
```
